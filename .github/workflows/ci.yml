name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  checks:
    name: Typecheck, Lint, Test, Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Validate data
        run: npm run validate:data

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

  e2e:
    # Chromium + Firefox only. WebKit is deliberately excluded here — its
    # Linux/CI build has repeatedly shown debounced-UI timing flakes on this
    # runner class that never reproduce locally (see .ai/TODO.md Backlog).
    # WebKit still runs in full locally (playwright.config.ts's 3 projects
    # are unchanged) and is enforced pre-push (.husky/pre-push), so it isn't
    # dropped from the quality bar — just moved off this specific runner.
    name: End-to-end tests (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox

      - name: End-to-end tests
        env:
          TRANSPORT_NSW_API_KEY: ${{ secrets.TRANSPORT_NSW_API_KEY }}
        run: npx playwright test --project=chromium --project=firefox --shard=${{ matrix.shard }}/2

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7
